<style>
/* Layout: Vollbild-3D-Bühne. Steuerung nur an den Rändern: Ansichtsleiste rechts, Bottom-Sheet unten, Auswahl-Chip darüber. */
:root {
  color-scheme: dark;
  --ink: #05070b;
  --fg: #f4f7ff;
  --muted: rgba(232, 238, 255, .62);
  --faint: rgba(232, 238, 255, .38);
  --hair: rgba(255, 255, 255, .14);
  --cat-actor: #7df0b0;
  --cat-camera: #4cc9ff;
  --cat-light: #ffc24d;
  --danger: #ff7a7a;
  --f-ui: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, sans-serif;
  --f-disp: 'Syne', var(--f-ui);
  --f-mono: 'DM Mono', ui-monospace, Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: calc(env(safe-area-inset-top, 0px) + 12px);
  --gb: calc(env(safe-area-inset-bottom, 0px) + 10px);
  --sheet-h: 88px;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; color: var(--fg); font: 15px/1.4 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background:
    radial-gradient(900px 620px at 12% 8%, rgba(76, 201, 255, .30), transparent 62%),
    radial-gradient(800px 620px at 92% 34%, rgba(255, 194, 77, .20), transparent 62%),
    radial-gradient(900px 700px at 46% 104%, rgba(125, 240, 176, .18), transparent 62%),
    var(--ink);
  -webkit-user-select: none; user-select: none; overscroll-behavior: none;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* Liquid Glass */
.glass {
  position: relative;
  background: linear-gradient(145deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, .045));
  -webkit-backdrop-filter: blur(26px) saturate(185%); backdrop-filter: blur(26px) saturate(185%);
  border: 1px solid var(--hair);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .38), inset 0 -1px 1px rgba(255, 255, 255, .06), 0 10px 36px rgba(0, 0, 0, .42);
}
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, .2), transparent 46%); opacity: .55; }
.fill { background: linear-gradient(145deg, rgba(255, 255, 255, .95), rgba(214, 224, 255, .85)); color: #0b1020; border-color: rgba(255, 255, 255, .6); }

#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; position: absolute; }

/* Marke */
#brand { left: var(--gl); top: var(--gt); display: flex; align-items: center; gap: 9px; padding: 7px 14px 7px 8px; border-radius: 22px; }
#brand .lg { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(140deg, var(--cat-camera), var(--cat-light)); color: #08101a; }
#brand b { font: 800 16px/1 var(--f-disp); letter-spacing: .01em; }
#brand small { font: 400 10.5px/1 var(--f-mono); color: var(--muted); margin-left: 2px; }

/* Ansichtsleiste rechts */
#rbar { right: var(--gr); top: calc(var(--gt) + 4px); display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 28px; }
#rbar button { width: 52px; padding: 9px 0 7px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font: 500 10px/1 var(--f-ui); letter-spacing: .02em; transition: background .2s, color .2s, transform .15s; }
#rbar button:active { transform: scale(.94); }
#rbar button[aria-pressed="true"] { background: linear-gradient(145deg, rgba(255, 255, 255, .95), rgba(214, 224, 255, .85)); color: #0b1020; box-shadow: 0 4px 18px rgba(255, 255, 255, .25); }

/* Readout */
#readout { left: 50%; top: calc(var(--gt) + 6px); transform: translate(-50%, -8px); padding: 9px 16px; border-radius: 20px; font: 500 13px/1 var(--f-mono); white-space: nowrap; opacity: 0; pointer-events: none !important; transition: opacity .18s, transform .18s; }
#readout.on { opacity: 1; transform: translate(-50%, 0); }

/* Auswahl-Chip */
#selbar { left: var(--gl); bottom: calc(var(--sheet-h) + var(--gb) + 12px); display: flex; align-items: center; gap: 4px; padding: 5px 5px 5px 14px; border-radius: 26px; max-width: calc(100% - var(--gl) - var(--gr) - 72px); }
#selbar .nm { display: flex; align-items: center; gap: 9px; font-weight: 600; min-width: 0; padding-right: 8px; }
#selbar .nm i { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 12px currentColor; background: currentColor; }
#selbar .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rb { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .1); transition: background .15s, transform .15s; flex: none; }
.rb:active { transform: scale(.92); background: rgba(255, 255, 255, .25); }
.rb.dan { color: var(--danger); }
.rb.cam { background: rgba(76, 201, 255, .22); color: var(--cat-camera); }

/* Director HUD */
#dirtop { left: var(--gl); right: var(--gr); top: var(--gt); display: flex; gap: 8px; align-items: center; }
#dirtop .x { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; }
#dirtop .asp { display: flex; gap: 4px; padding: 5px; border-radius: 26px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
#dirtop .asp button { padding: 9px 12px; border-radius: 20px; font: 500 12px/1 var(--f-mono); color: var(--muted); white-space: nowrap; }
#dirtop .asp button[aria-pressed="true"] { background: linear-gradient(145deg, #fff, #d6e0ff); color: #0b1020; }
#hudl { left: var(--gl); bottom: calc(var(--sheet-h) + var(--gb) + 12px); display: flex; align-items: baseline; gap: 6px; padding: 10px 18px; border-radius: 26px; color: var(--cat-camera); }
#hudl b { font: 800 40px/1 var(--f-disp); font-variant-numeric: tabular-nums; }
#hudl span { font: 500 13px/1 var(--f-mono); color: var(--muted); }
#camsw { right: var(--gr); bottom: calc(var(--sheet-h) + var(--gb) + 12px); display: flex; gap: 4px; padding: 5px; border-radius: 26px; max-width: 60%; overflow-x: auto; scrollbar-width: none; }
#camsw button { padding: 9px 14px; border-radius: 20px; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap; }
#camsw button[aria-pressed="true"] { background: rgba(76, 201, 255, .26); color: var(--cat-camera); }
#frame { position: fixed; z-index: 4; pointer-events: none; }
#frame .thirds { position: absolute; inset: 0; background:
  linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.3) calc(33.333% - .5px) calc(33.333% + .5px), transparent calc(33.333% + .5px) calc(66.666% - .5px), rgba(255,255,255,.3) calc(66.666% - .5px) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
  linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.3) calc(33.333% - .5px) calc(33.333% + .5px), transparent calc(33.333% + .5px) calc(66.666% - .5px), rgba(255,255,255,.3) calc(66.666% - .5px) calc(66.666% + .5px), transparent calc(66.666% + .5px)); }
#frame .tag { position: absolute; left: 12px; bottom: 10px; font: 500 11px/1 var(--f-mono); letter-spacing: .06em; color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .9); display: flex; gap: 8px; align-items: center; }
#frame .tag i { width: 8px; height: 8px; border-radius: 50%; background: #ff4d4d; box-shadow: 0 0 10px #ff4d4d; }

/* Bottom Sheet */
#sheet { left: var(--gl); right: var(--gr); bottom: var(--gb); height: var(--sheet-h); border-radius: 32px; display: flex; flex-direction: column; overflow: hidden; transition: height .38s cubic-bezier(.2, .85, .25, 1); }
#sheet.drag { transition: none; }
.sh-head { flex: none; padding: 8px 12px 10px; touch-action: none; cursor: grab; }
.grab { width: 38px; height: 5px; border-radius: 5px; background: rgba(255, 255, 255, .35); margin: 0 auto 9px; }
.tabrow { display: flex; align-items: center; gap: 6px; }
.tabs { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab { padding: 10px 14px; border-radius: 20px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 8px; min-width: 0; }
.tab .d { width: 9px; height: 9px; border-radius: 50%; flex: none; background: currentColor; box-shadow: 0 0 10px currentColor; }
.tab span.t { overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.tab[aria-selected="true"] { background: rgba(255, 255, 255, .16); color: var(--fg); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); }
.tab:disabled { opacity: .4; }
.addb { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; background: linear-gradient(145deg, #fff, #d6e0ff); color: #0b1020; box-shadow: 0 4px 18px rgba(255, 255, 255, .25); transition: transform .15s; }
.addb:active { transform: scale(.92); }
#sbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 24px; scrollbar-width: none; }
.sec-t { display: flex; align-items: center; gap: 8px; margin: 14px 0 10px; font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sec-t em { font-style: normal; color: var(--fg); background: rgba(255, 255, 255, .14); padding: 3px 7px; border-radius: 8px; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 20px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .1); text-align: left; font-weight: 600; font-size: 13px; transition: background .15s, transform .15s; }
.tile:active { transform: scale(.95); background: rgba(255, 255, 255, .16); }
.tile .ti { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; }
.tile small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
.c-actor { color: var(--cat-actor); } .c-camera { color: var(--cat-camera); } .c-light { color: var(--cat-light); }
.bg-actor { background: rgba(125, 240, 176, .18); } .bg-camera { background: rgba(76, 201, 255, .18); } .bg-light { background: rgba(255, 194, 77, .18); }
.rowwrap { position: relative; border-radius: 18px; overflow: hidden; margin-bottom: 6px; }
.rowwrap .del { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; background: rgba(255, 90, 90, .35); color: #fff; font-weight: 600; }
.row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border-radius: 18px; text-align: left; background: rgba(28, 34, 48, .72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); touch-action: pan-y; transition: transform .2s; }
.row[aria-pressed="true"] { background: rgba(60, 70, 96, .85); box-shadow: inset 0 0 0 1px currentColor; }
.row .ri { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.row .nm { flex: 1; min-width: 0; font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .mt { font: 400 11.5px/1 var(--f-mono); color: var(--muted); white-space: nowrap; }
.empty { color: var(--faint); padding: 8px 2px; font-size: 13.5px; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 12px; }
.hint b { color: var(--fg); font-weight: 600; }
.nameinp { width: 100%; padding: 12px 14px; border-radius: 16px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .12); font-weight: 600; font-size: 16px; -webkit-user-select: text; user-select: text; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }

/* Scrub-Kachel: Wert durch horizontales Wischen ändern */
.scrub { position: relative; padding: 11px 14px 0; height: 78px; border-radius: 20px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .1); overflow: hidden; touch-action: pan-y; cursor: ew-resize; }
.scrub .sl { display: block; font-size: 11.5px; color: var(--muted); }
.scrub .sv { display: block; font: 700 22px/1.2 var(--f-disp); font-variant-numeric: tabular-nums; margin-top: 2px; }
.scrub .sv small { font: 400 11px var(--f-mono); color: var(--muted); margin-left: 3px; }
.scrub .tk { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: repeating-linear-gradient(to right, rgba(255, 255, 255, .35) 0 1.5px, transparent 1.5px 11px); -webkit-mask-image: linear-gradient(to right, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(to right, transparent, #000 25%, #000 75%, transparent); }
.scrub::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 2px; height: 22px; margin-left: -1px; background: currentColor; border-radius: 2px; }
.scrub.act { background: rgba(255, 255, 255, .14); }
/* Licht-Pad */
.pad { position: relative; height: 168px; border-radius: 22px; overflow: hidden; touch-action: none; cursor: crosshair; border: 1px solid rgba(255, 255, 255, .16);
  background: linear-gradient(to top, rgba(5, 7, 11, .92), rgba(5, 7, 11, 0) 85%), linear-gradient(to right, #ff8a1a, #ffd7a0 35%, #ffffff 55%, #cfe0ff 75%, #8fb6ff); }
.pad .kn { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, .25), 0 0 24px 6px var(--kc, #fff); background: var(--kc, #fff); }
.pad .pv { position: absolute; left: 12px; top: 10px; font: 500 12px/1 var(--f-mono); color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .8); }
.pad .pl { position: absolute; right: 12px; bottom: 10px; font: 400 10.5px/1 var(--f-mono); color: rgba(255, 255, 255, .75); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
.chip { padding: 10px 14px; border-radius: 18px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .1); font: 500 13px/1 var(--f-ui); }
.chip[aria-pressed="true"] { background: rgba(76, 201, 255, .26); border-color: var(--cat-camera); color: var(--cat-camera); }
.chip.go { font-weight: 600; }
.tgl { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 12px 2px; text-align: left; font-size: 15px; }
.tgl i { width: 50px; height: 30px; border-radius: 30px; background: rgba(255, 255, 255, .16); position: relative; transition: background .2s; flex: none; }
.tgl i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .4); transition: transform .2s; }
.tgl[aria-checked="true"] i { background: #34d399; }
.tgl[aria-checked="true"] i::after { transform: translateX(20px); }
.btnw { width: 100%; padding: 14px; border-radius: 18px; background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .12); font-weight: 600; margin-top: 8px; }
.btnw.dan { color: var(--danger); }

#toast { left: 50%; bottom: calc(var(--sheet-h) + var(--gb) + 70px); transform: translate(-50%, 10px); padding: 12px 16px; border-radius: 22px; display: flex; align-items: center; gap: 14px; font-size: 14px; opacity: 0; pointer-events: none !important; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto !important; }
#toast button { font-weight: 700; color: var(--cat-camera); padding: 4px 2px; }
#ui svg { display: inline-block; vertical-align: middle; }
#sheet[data-s="peek"] .tabrow { display: none; }
.dock { display: flex; gap: 6px; align-items: center; }
.dk { flex: 1; min-width: 0; height: 46px; border-radius: 23px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 14px; background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .14); transition: transform .15s, background .15s; white-space: nowrap; }
.dk:active { transform: scale(.94); background: rgba(255, 255, 255, .22); }
.dk[data-add="actor"] { color: var(--cat-actor); } .dk[data-add="camera"] { color: var(--cat-camera); } .dk[data-add="light"] { color: var(--cat-light); }
.tabrow { margin-top: 8px; }
#err { position: fixed; z-index: 99; left: 16px; right: 16px; top: 16px; padding: 14px 16px; border-radius: 18px; background: rgba(120, 20, 30, .85); color: #fff; font: 500 13px/1.4 var(--f-mono); border: 1px solid rgba(255, 150, 150, .5); }
#snap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); background: rgba(3, 5, 9, .72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
#snap .card { width: min(560px, 100%); border-radius: 28px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
#snapimg { width: 100%; max-height: 56vh; object-fit: contain; border-radius: 18px; background: #05070b; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; }
#snap .acts { display: flex; gap: 8px; flex-wrap: wrap; }
#snap .acts > * { flex: 1; min-width: 120px; text-align: center; padding: 13px 14px; border-radius: 18px; font-weight: 700; font-size: 14px; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .16); color: var(--fg); text-decoration: none; }
#snap .acts .main { background: linear-gradient(145deg, #fff, #d6e0ff); color: #0b1020; }
#snap p { margin: 0; font-size: 12.5px; color: var(--muted); }
@media (min-width: 720px) { #sheet { left: auto; width: 460px; } #selbar, #hudl { left: var(--gl); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="frame" hidden><div class="thirds"></div><div class="tag"><i></i><span></span></div></div>

  <div id="selbar" class="glass" hidden>
    <div class="nm c-light" id="selnm"><i></i><span></span></div>

    <button type="button" class="rb" id="seldup" aria-label="Duplizieren"></button>

  </div>

      <div class="grab"></div>
      <div class="dock" aria-label="Objekte hinzufügen">

          <button type="button" class="tab" role="tab" data-tab="obj"></button>

      </div>

    <div id="sbody"></div>

  <div id="toast" class="glass" role="status"></div>
</div>

<div id="snap" hidden>
  <div class="glass card">
    <img id="snapimg" alt="Snapshot der aktuellen Ansicht">

  if (!sw.on && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) { sw.on = true; swipeMoved = true; sw.row.style.transition = 'none'; try { sw.row.setPointerCapture(e.pointerId); } catch (_) {} }
  if (sw.on) { sw.dx = Math.min(0, dx); sw.row.style.transform = `translateX(${sw.dx}px)`; }
});
const swEnd = () => {
  if (!sw) return; const r = sw.row;
  if (sw.on && sw.dx < -90) { removeItem(+r.dataset.id); } else { r.style.transition = ''; r.style.transform = ''; }
  sw = null; setTimeout(() => { swipeMoved = false; }, 60);
};
$('#sbody').addEventListener('pointerup', swEnd); $('#sbody').addEventListener('pointercancel', swEnd);

/* ---------- Ränder: Auswahl-Chip, HUD, Ansichtsleiste ---------- */
const VIEWS = { overview: ['cube', 'Set'], top: ['top', 'Top'], crew: ['crew', 'Regie'], director: ['film', 'Kamera'] };
document.querySelectorAll('#rbar [data-view]').forEach(b => { const v = VIEWS[b.dataset.view]; b.innerHTML = `${ico(v[0], 22)}<span>${v[1]}</span>`; b.setAttribute('aria-label', { overview: 'Gesamtes Set', top: 'Vogelperspektive', crew: 'Regie-Perspektive hinter der Kamera', director: 'Director’s Cut durch die Kamera' }[b.dataset.view]); b.addEventListener('click', () => { setView(b.dataset.view); vib(8); }); });
function updateViewUI() { document.querySelectorAll('#rbar [data-view]').forEach(b => b.setAttribute('aria-pressed', S.view === b.dataset.view)); }
function renderEdges() {
  const it = byId(S.sel), dir = S.mode === 'director';
  const sb = $('#selbar'); sb.hidden = !it || dir;
  if (it) {
    $('#selnm').className = 'nm c-' + it.type; $('#selnm span').textContent = it.name;
    $('#selcam').hidden = it.type !== 'camera';
  }
  $('#brand').hidden = dir; $('#rbar').style.top = dir ? 'calc(var(--gt) + 62px)' : '';
  $('#dirtop').hidden = !dir; $('#hudl').hidden = !dir;
  if (dir) {
    $('#asp').innerHTML = ASPECTS.map(a => `<button type="button" data-a="${a[1]}" aria-pressed="${a[1] === S.aspect}">${a[0]}</button>`).join('');
    const cams = S.items.filter(i => i.type === 'camera'), cs = $('#camsw'); cs.hidden = cams.length < 2;
    cs.innerHTML = cams.map(c => `<button type="button" data-c="${c.id}" aria-pressed="${c.id === S.dirId}">${esc(c.name)}</button>`).join('');
  } else $('#camsw').hidden = true;
  $('#frame').hidden = !(dir && !T);
}
$('#asp').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; S.aspect = +b.dataset.a; RT.forEach((rt, id) => { const it = byId(id); if (it.type === 'camera') applyItem(it); }); renderEdges(); save(); vib(6); });
$('#camsw').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) select(+b.dataset.c); });
$('#dirx').addEventListener('click', () => setView('overview'));
$('#selcam').addEventListener('click', () => setView('director'));
$('#seldup').addEventListener('click', () => duplicateItem(S.sel));
$('#seldel').addEventListener('click', () => removeItem(S.sel));
$('#dirx').innerHTML = ico('close', 20); $('#seldup').innerHTML = ico('copy', 18); $('#seldel').innerHTML = ico('trash', 18); $('#selcam').innerHTML = ico('film', 18);
$('#addb').innerHTML = ico('chev', 22, 2.4);
document.querySelectorAll('.dk').forEach(b => { const t = b.dataset.add; b.innerHTML = ico('plus', 16, 2.8) + `<span>${{ actor: 'Person', camera: 'Kamera', light: 'Licht' }[t]}</span>`; });
$('#snapbtn').innerHTML = ico('image', 22) + '<span>Foto</span>'; $('#lg').innerHTML = ico('logo', 17, 2.4);
function renderAll() { updateTabs(); renderBody(); renderEdges(); updateViewUI(); }

/* ---------- Snapshot ---------- */
let snapBlob = null;
function snapshot() {
  if (T) return;
  render();
  const k = canvas.width / canvas.clientWidth, v = lastView || { vx: 0, vy: 0, vw: canvas.clientWidth, vh: canvas.clientHeight };
  const c = document.createElement('canvas'); c.width = Math.max(2, Math.round(v.vw * k)); c.height = Math.max(2, Math.round(v.vh * k));
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, c.width, c.height); gr.addColorStop(0, '#142038'); gr.addColorStop(1, '#05070b');
  g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(canvas, v.vx * k, v.vy * k, v.vw * k, v.vh * k, 0, 0, c.width, c.height);
  const it = byId(S.dirId), cap = S.mode === 'director' && it ? `SHOTPLANNER · ${it.name.toUpperCase()} · ${Math.round(it.f)} MM` : 'SHOTPLANNER';
  g.font = `500 ${Math.round(c.width / 48)}px ui-monospace, Menlo, monospace`; g.fillStyle = 'rgba(255,255,255,.8)'; g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 6; g.fillText(cap, c.width * .025, c.height - c.width * .02);
  let url; try { url = c.toDataURL('image/png'); } catch (e) { toast('Snapshot nicht möglich.'); return; }
  $('#snapimg').src = url; $('#snap').hidden = false; vib(12);
  c.toBlob(b => { snapBlob = b; }, 'image/png');
}
$('#snapbtn').addEventListener('click', snapshot);
$('#snapx').addEventListener('click', () => { $('#snap').hidden = true; });
$('#snap').addEventListener('click', e => { if (e.target.id === 'snap') $('#snap').hidden = true; });
$('#snapdl').addEventListener('click', async () => {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (!dl || !snapBlob) throw 0;
    await dl.save({ filename: 'shotplanner-snapshot.png', data: snapBlob });
    toast('Snapshot gespeichert.');
  } catch (e) { if (e && e.code === 'declined') return; toast('Download hier nicht möglich. Bild lange drücken oder Rechtsklick.'); }
});
$('#snapcopy').addEventListener('click', async () => {
  try { if (!snapBlob) throw 0; await navigator.clipboard.write([new ClipboardItem({ 'image/png': snapBlob })]); toast('Bild in die Zwischenablage kopiert.'); }
  catch (_) { toast('Kopieren nicht möglich. Bild lange drücken oder Rechtsklick.'); }
});

/* ---------- Toast ---------- */
let tt;
function toast(msg, act, fn) {
  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>` + (act ? `<button type="button">${esc(act)}</button>` : '');
  if (act) t.querySelector('button').onclick = () => { fn(); t.classList.remove('on'); };
  t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), act ? 4500 : 2400);
}

/* ---------- Tastatur (Desktop) ---------- */
document.addEventListener('keydown', e => {
  const tag = e.target.tagName; if (tag === 'INPUT' && e.target.type === 'text') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { e.preventDefault(); removeItem(S.sel); }
  else if (e.key === 'Escape' && S.sel) select(null);
  else if ((e.key === 'd' || e.key === 'D') && S.sel) duplicateItem(S.sel);
  else if (e.key === '1') setView('overview'); else if (e.key === '2') setView('top'); else if (e.key === '3') setView('crew'); else if (e.key === '4') setView('director');
});

/* ---------- Speichern ---------- */
let st;
function save() { clearTimeout(st); st = setTimeout(() => { try { localStorage.setItem('shotplanner.v1', JSON.stringify({ room: S.room, items: S.items, aspect: S.aspect, work: S.work, grid: S.grid, cones: S.cones, thirds: S.thirds, n: S.n, uid })); } catch (_) {} }, 250); }
function load() {
  try {
    const d = JSON.parse(localStorage.getItem('shotplanner.v1') || 'null');
    if (!d || !Array.isArray(d.items)) return false;
    S.room = d.room; Object.assign(S, { aspect: d.aspect || 2.39, work: d.work !== false, grid: d.grid !== false, cones: d.cones !== false, thirds: d.thirds !== false, n: d.n || S.n });
    uid = d.uid || 1; buildRoom(); d.items.forEach(attach);
    S.lastCam = (S.items.find(i => i.type === 'camera') || {}).id || null; return true;
  } catch (_) { return false; }
}

/* ---------- Start ---------- */
buildRoom();
const restored = load();
setSheet('peek', false);
if (!restored) sampleScene(); else { refreshVis(); renderAll(); setView('overview', true); }
document.fonts && document.fonts.ready.then(() => { S.items.forEach(it => { const rt = RT.get(it.id); rt.lk = null; applyItem(it); }); });
try { if (!localStorage.getItem('shotplanner.hint')) { localStorage.setItem('shotplanner.hint', '1'); setTimeout(() => toast('Tippe ein Objekt an. Ziehen bewegt, zwei Finger drehen.'), 900); } } catch (_) {}
requestAnimationFrame(loop);
})();
</script>
